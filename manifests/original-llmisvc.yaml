# Example: original LLMInferenceService (PHI-4 on vLLM v0.24.0)
# Replace name, namespace, hardware profile, model URI, and resource values for your deployment.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  annotations:
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: RedHatAI/phi-4-FP8-dynamic
    serving.kserve.io/stop: 'false'
  name: redhataiphi-4-fp8-dynamic
  namespace: runtime-swap
  finalizers:
    - serving.kserve.io/llmisvc-finalizer
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
spec:
  model:
    name: redhataiphi-4-fp8-dynamic
    uri: 'oci://registry.redhat.io/rhelai1/modelcar-phi-4-fp8-dynamic:1.5'
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '4'
            memory: 8Gi
            nvidia.com/gpu: '1'
